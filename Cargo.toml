[package]
name = "botrs"
version = "0.13.0"
edition = "2024"
authors = ["YinMo19"]
description = "A Rust QQ Bot framework based on QQ Guild Bot API"
license = "MIT"
repository = "https://github.com/YinMo19/botrs"
keywords = ["qq", "bot", "guild", "api", "async"]
readme = "README.md"
categories = ["api-bindings", "asynchronous", "network-programming"]
documentation = "https://docs.rs/botrs"
exclude = [
    ".github/",
    "docs/.vitepress/",
    "package.json",
    "pnpm-lock.yaml",
]

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-webpki-roots"] }

# HTTP client
reqwest = { version = "0.12.22", default-features = false, features = ["charset", "http2", "json", "stream", "system-proxy", "rustls-tls-webpki-roots"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# WebSocket and networking
url = "2.4"
futures-util = "0.3"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

# Optional features for examples
toml = { version = "0.8", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.0"

[features]
default = []
examples = ["toml", "tracing-subscriber"]

[[example]]
name = "simple_bot"
path = "examples/basic/simple_bot.rs"
required-features = ["examples"]

